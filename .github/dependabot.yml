version: 2

updates:
  # .NET NuGet dependencies — versions are centralized in Directory.Packages.props
  # at the repo root, so a single root entry covers every project in the solution.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # Batch the framework/runtime families so related packages bump together.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      entity-framework:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
      aspire:
        patterns:
          - "Aspire.*"
          - "Microsoft.Extensions.ServiceDiscovery*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      identity-model:
        patterns:
          - "Microsoft.IdentityModel.*"
          - "System.IdentityModel.Tokens.Jwt"
          - "Microsoft.AspNetCore.Authentication.JwtBearer"
      test-dependencies:
        patterns:
          - "xunit*"
          - "NSubstitute*"
          - "AwesomeAssertions*"
          - "CsCheck"
          - "bunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Mvc.Testing"
        dependency-type: "development"

  # GitHub Actions used by .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
